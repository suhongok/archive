%YAML:1.0

#--------------------------------------------------------------------------------------------
# Orbbec Astro Pro 카메라 설정 파일 (ORB-SLAM3용)
#
# 사용법:
#   1. test_orbbec_camera.py를 실행하여 실제 카메라 파라미터 확인
#   2. 아래 Camera.fx, fy, cx, cy 값을 실제 값으로 수정
#   3. ORB-SLAM3 실행 시 이 파일 경로 지정
#--------------------------------------------------------------------------------------------

#--------------------------------------------------------------------------------------------
# Camera Parameters
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# 카메라 해상도
Camera.width: 640
Camera.height: 480

# ★★★ 아래 값들을 test_orbbec_camera.py 출력 결과로 교체하세요 ★★★
# RGB 카메라 내부 파라미터 (Intrinsic Parameters)
# 일반적인 Astro Pro 근사값 (실제 값으로 교체 권장)
Camera.fx: 554.254
Camera.fy: 554.254
Camera.cx: 320.5
Camera.cy: 240.5

# 왜곡 계수 (Distortion Coefficients)
# Orbbec 카메라는 보통 왜곡 보정된 이미지 출력
Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

# RGB-D 카메라 설정
Camera.RGB: 1

# 깊이 맵 스케일 팩터
# Orbbec은 mm 단위로 깊이 출력 → 1000.0 사용 (m 변환)
DepthMapFactor: 1000.0

# 깊이 신뢰 임계값 (이 값보다 먼 깊이는 무시)
# Astro Pro 유효 범위: 0.4m ~ 8m
ThDepth: 40.0

# 프레임레이트
Camera.fps: 30

#--------------------------------------------------------------------------------------------
# ORB Extractor Parameters
#--------------------------------------------------------------------------------------------

# 프레임당 추출할 특징점 수
# 환경이 복잡하면 증가, 단순하면 감소
ORBextractor.nFeatures: 1000

# 이미지 피라미드 스케일 팩터
ORBextractor.scaleFactor: 1.2

# 이미지 피라미드 레벨 수
ORBextractor.nLevels: 8

# FAST 특징점 검출 임계값
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Stereo/RGB-D Parameters (RGB-D 모드에서 사용)
#--------------------------------------------------------------------------------------------

# 스테레오/깊이 임계값 (이 깊이 내의 포인트만 사용)
# 단위: 카메라 기준선 배수 (RGB-D는 depth를 baseline으로 변환)
ThDepth: 40.0

# 깊이 Close/Far 포인트 임계값
# Close point: 루프 클로징에 사용 안함
# Far point: 지역 매핑에만 사용

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

#--------------------------------------------------------------------------------------------
# Map Parameters
#--------------------------------------------------------------------------------------------

# 맵 포인트 최소 관측 횟수
# 증가하면 더 안정적인 포인트만 유지 (노이즈 감소)
Map.minObs: 2

#--------------------------------------------------------------------------------------------
# Loop Closing Parameters
#--------------------------------------------------------------------------------------------

# 루프 클로징 활성화 (0: 비활성화, 1: 활성화)
LoopClosing: 1

#--------------------------------------------------------------------------------------------
# Tracking Parameters
#--------------------------------------------------------------------------------------------

# 최소 키프레임 간격 (프레임 수)
MinFrames: 0

# 최대 키프레임 간격
MaxFrames: 30
